name: Daily QKEY Rewards (KST 09:00)

on:
  schedule:
    # KST 09:00 = UTC 00:00 (매일)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-rewards
  cancel-in-progress: false

jobs:
  pay-daily-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Write reward script
        run: |
          cat > /tmp/pay.js << 'SCRIPT_EOF'
          const https = require('https');
          const { URL } = require('url');

          const apiBase = process.env.API_BASE;
          const adminId = (process.env.ADMIN_ID || '').trim();
          const adminPw = (process.env.ADMIN_PW || '').trim();

          if (!adminId || !adminPw) {
            console.error('ADMIN_ID / ADMIN_PW secrets are not set');
            process.exit(1);
          }
          console.log('ADMIN_ID length =', adminId.length, ', ADMIN_PW length =', adminPw.length);

          function post(url, body, extraHeaders) {
            return new Promise(function(resolve, reject) {
              const u = new URL(url);
              const data = JSON.stringify(body);
              const headers = Object.assign({
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(data)
              }, extraHeaders || {});
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname,
                method: 'POST',
                headers: headers
              }, function(res) {
                let chunks = '';
                res.on('data', function(d) { chunks += d; });
                res.on('end', function() { resolve({ status: res.statusCode, body: chunks }); });
              });
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          (async function() {
            try {
              console.log('[1/2] Admin login');
              const loginRes = await post(apiBase + '/api/auth/admin-login', {
                adminId: adminId,
                password: adminPw
              });
              console.log('Login HTTP', loginRes.status, 'body:', loginRes.body);
              const loginJson = JSON.parse(loginRes.body);
              if (!loginJson.success || !loginJson.token) {
                console.error('Admin login failed');
                process.exit(1);
              }
              const token = loginJson.token;
              console.log('Admin login OK (token length=' + token.length + ')');

              console.log('[2/2] Pay daily rewards');
              const rewardRes = await post(apiBase + '/api/rewards/daily', {}, {
                'Authorization': 'Bearer ' + token
              });
              console.log('Reward HTTP', rewardRes.status);
              console.log('Reward response:', rewardRes.body);
              const rewardJson = JSON.parse(rewardRes.body);
              if (!rewardJson.success) {
                console.error('Daily reward API returned failure');
                process.exit(1);
              }
              console.log('Daily QKEY rewards distribution succeeded');
            } catch (err) {
              console.error('ERROR:', err.message);
              process.exit(1);
            }
          })();
          SCRIPT_EOF
          echo "Script written, size:"
          wc -c /tmp/pay.js

      - name: Run reward script
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          API_BASE: https://pqcpay.co.kr
        run: node /tmp/pay.js
