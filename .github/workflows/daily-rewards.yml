name: Daily QKEY Rewards (KST 09:00)

on:
  schedule:
    # KST 09:00 = UTC 00:00 (매일)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-rewards
  cancel-in-progress: false

jobs:
  pay-daily-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pay daily QKEY rewards via pqcpay.co.kr
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          API_BASE: https://pqcpay.co.kr
        run: |
          node <<'EOF'
          const https = require('https');
          const { URL } = require('url');

          const apiBase = process.env.API_BASE;
          const adminId = (process.env.ADMIN_ID || '').trim();
          const adminPw = (process.env.ADMIN_PW || '').trim();

          if (!adminId || !adminPw) {
            console.error('::error::ADMIN_ID / ADMIN_PW secrets are not set');
            process.exit(1);
          }
          console.log('ADMIN_ID length =', adminId.length, ', ADMIN_PW length =', adminPw.length);

          function post(url, body, headers = {}) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const data = JSON.stringify(body);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data),
                  ...headers
                }
              }, (res) => {
                let chunks = '';
                res.on('data', d => chunks += d);
                res.on('end', () => resolve({ status: res.statusCode, body: chunks }));
              });
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          (async () => {
            try {
              console.log('[1/2] Admin login -> ' + apiBase + '/api/auth/admin-login');
              const loginRes = await post(apiBase + '/api/auth/admin-login', {
                adminId: adminId,
                password: adminPw
              });
              console.log('Login HTTP', loginRes.status);
              let loginJson;
              try { loginJson = JSON.parse(loginRes.body); }
              catch (e) { console.error('Invalid JSON:', loginRes.body); process.exit(1); }
              if (!loginJson.success || !loginJson.token) {
                console.error('::error::Admin login failed:', JSON.stringify(loginJson));
                process.exit(1);
              }
              const token = loginJson.token;
              console.log('Admin login OK (token length=' + token.length + ')');

              console<span class="cursor">█</span>
