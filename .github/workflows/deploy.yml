name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - saycoin-staking-platform
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=saycoin-staking --branch=saycoin-staking-platform --commit-dirty=true

      - name: Smoke test - dashboard JS syntax
        run: |
          sleep 30
          curl -sS https://pqcpay.co.kr/dashboard > /tmp/prod_dash.html || exit 0
          npm install --no-save acorn
          node -e "
            const fs=require('fs'); const acorn=require('acorn');
            const html=fs.readFileSync('/tmp/prod_dash.html','utf8');
            const re=/<script(?![^>]*src=)[^>]*>([\\s\\S]*?)<\\/script>/g;
            let m, scripts=[]; while((m=re.exec(html))!==null) scripts.push(m[1]);
            if (!scripts.length) { console.log('no inline script'); process.exit(0); }
            const body=scripts.sort((a,b)=>b.length-a.length)[0];
            try { acorn.parse(body,{ecmaVersion:2022,sourceType:'script'}); console.log('PASS production /dashboard JS valid'); }
            catch(e){ console.error('FAIL BROKEN:', e.message); process.exit(1); }
          " || echo "::warning::Smoke test failed"
